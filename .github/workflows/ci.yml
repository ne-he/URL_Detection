name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Cepat (<1 menit): validasi schema + seluruh alur API pakai stub predictor.
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests -x -q --ignore=backend/tests/test_label_orientation.py
        working-directory: .
        env:
          PYTHONPATH: backend

  # Berat (butuh torch + download MiniLM): mengunci orientasi label model asli.
  # Jalan di push ke main & manual dispatch — tidak memperlambat PR kecil.
  model-regression:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # Test ini di-skip di level modul kalau sentence-transformers gagal di-import atau
      # artefak bobot tidak ada. Skip bikin pytest keluar dengan kode 0, jadi job ini bisa
      # hijau tanpa satu pun assertion orientasi label pernah dijalankan, dan penjaganya
      # mati diam-diam. Karena itu jumlah test yang LULUS diperiksa eksplisit di bawah.
      - name: Regression orientasi label (wajib benar-benar jalan, bukan di-skip)
        run: |
          set -o pipefail
          pytest backend/tests/test_label_orientation.py -x -q -rs | tee pytest-out.txt
          if ! grep -qE '[0-9]+ passed' pytest-out.txt; then
            echo "::error::test_label_orientation tidak menjalankan satu pun assertion (di-skip seluruhnya). Penjaga orientasi label TIDAK aktif, jadi job ini digagalkan."
            exit 1
          fi
        env:
          PYTHONPATH: backend
